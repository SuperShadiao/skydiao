name: 崩溃类BUG
description: 提交游戏崩溃、闪退或游戏无法启动等严重问题
title: "[Crash]: "
labels: ["bug", "crash"]
body:
  - type: input
    id: mod-version
    attributes:
      label: Mod版本
      description: 请填写你当前使用的 Mod 版本号
      placeholder: "例如: 0.4.0"
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 如何复现 (或者当时在做什么)
      description: 请详细描述导致崩溃的操作步骤，或你当时正在做的事情。
      placeholder: |
        例如: 在我XXX的时候, 游戏会发生崩溃
    validations:
      required: true

  - type: upload
    id: crash-log-file
    attributes:
      label: 崩溃报告 / latest.log (文件上传)
      description: |
        或者，你也可以直接上传文件。
        - **崩溃报告**：点击崩溃页面左下角的按钮导出，或在.minecraft/crash-reports文件夹中。
        - **latest.log**：位于 `.minecraft/logs/latest.log`。
    validations:
      required: true