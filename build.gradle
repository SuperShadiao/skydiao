plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // custom
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation fileTree(dir: 'lib', includes: ['*.jar'])
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    // ircinner 单独打包成 skydiao-irc-<version>.jar, 不进入主 jar
    exclude 'pers/XiaoShadiao/skydiao/ircinner/**'

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
    manifest.attributes(
            "Main-Class": "pers.XiaoShadiao.HypixelHelperMainClass"
    )
}

// ircinner 独立 jar, 由 SkydiaoPreLaunch 在 preLaunch 阶段注入
// 当前 Loom/Minecraft 版本没有 remapJar 步骤(jar 产物即最终 mod jar), 因此直接打包编译产物即可
tasks.register('ircJar', Jar) {
    def baseName = project.base.archivesName.get()
    archiveFileName = "${baseName}-irc.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.client.output) {
        include 'pers/XiaoShadiao/skydiao/ircinner/**'
    }
    dependsOn tasks.named('compileClientJava')
    // src 中不存在 ircinner 包时跳过打包(该包已不在仓库中维护)
    onlyIf {
        def innerDir = file('src/client/java/pers/XiaoShadiao/skydiao/ircinner')
        def files = innerDir.isDirectory() ? innerDir.listFiles() : null
        files != null && files.length > 0
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('ircJar')
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// CUSTOM

tasks.register('processTextFiles', Copy) {
    from 'src/main/resources/assets/skydiao'
    include 'illegalwords.txt'
    into "${buildDir}/resources/main/assets/skydiao"

    filter { reader ->
        Base64.encoder.encodeToString(reader.getBytes('UTF-8'))
    }
}

tasks.register('zipGifs', Zip) {
    // 打包前先把文件名规整为 1~n.gif，保证 zip 内的编号与 data.json 一致
    doFirst {
        normalizeGifNaming()
    }

    // 要打包的源目录
    from 'hiddensomething/gifs'

    // 包含目录下所有文件
    include '**'

    // 不指定 into，避免把 gifs 文件夹本身打进去

    // 输出的 zip 文件路径
    destinationDirectory.set(file('hiddensomething'))
    archiveFileName.set('gifs.zip')
}

import groovy.json.JsonSlurper

// 将 gifs 目录下所有 X.gif 按序号升序重命名为 1~n.gif，并把 data.json 的 gif 总数更新为 n
def normalizeGifNaming() {
    def gifDir = project.file('hiddensomething/gifs')
    def jsonFile = new File(gifDir, 'data.json')
    if (!jsonFile.exists()) {
        throw new GradleException("data.json 不存在: ${jsonFile}")
    }

    def gifFiles = (gifDir.listFiles() ?: []).findAll { it.isFile() && it.name ==~ /\d+\.gif/ }
    gifFiles.sort { a, b -> (a.name - '.gif') as int <=> (b.name - '.gif') as int }

    // 文件名已经是 1~n 时跳过重命名，避免无谓的文件改动
    boolean alreadyOrdered = true
    gifFiles.eachWithIndex { f, i ->
        if (f.name != "${i + 1}.gif") {
            alreadyOrdered = false
        }
    }

    if (!alreadyOrdered) {
        // 两阶段重命名：先统一改成临时名，避免目标名与尚未处理的文件重名
        def tempFiles = []
        gifFiles.eachWithIndex { f, i ->
            def temp = new File(gifDir, ".renaming_${i}.tmp")
            if (!f.renameTo(temp)) {
                throw new GradleException("重命名失败: ${f.name} -> ${temp.name}")
            }
            tempFiles << temp
        }
        tempFiles.eachWithIndex { temp, i ->
            def target = new File(gifDir, "${i + 1}.gif")
            if (!temp.renameTo(target)) {
                throw new GradleException("重命名失败: ${temp.name} -> ${target.name}")
            }
        }
        println "已按顺序重命名 ${tempFiles.size()} 个 gif 文件为 1~${tempFiles.size()}.gif"
    }

    // 更新 data.json 中的 gif 总数（只替换数字，保留原有格式）
    def text = jsonFile.getText('UTF-8')
    def newCount = gifFiles.size()
    if ((new JsonSlurper().parseText(text).gif as Number).intValue() != newCount) {
        jsonFile.setText(text.replaceFirst(/"gif"\s*:\s*\d+/, '"gif": ' + newCount), 'UTF-8')
        println "已更新 data.json: gif = ${newCount}"
    }
}

tasks.register('checkGifsZipSize') {
    doLast {
        // 0. 先把 gif 文件规整为 1~n.gif 并同步 data.json 的 gif 总数
        normalizeGifNaming()

        // 1. 读取 JSON 配置
        def jsonFile = file('hiddensomething/gifs/data.json')
        if (!jsonFile.exists()) {
            throw new GradleException("data.json 不存在: ${jsonFile}")
        }
        def json = new JsonSlurper().parse(jsonFile)
        def gifCount = (json.gif as Number).intValue()

        // 2. 遍历检查每个 gif 是否存在
        // 注意: 原代码用 0..<63 表示 [0, 63)，即 0..62 共 63 个文件
        // 如果你的语义是"包含 63"，请改成 0..gifCount
        def gifDir = file('hiddensomething/gifs')
        def missing = []
        for (int i = 0; i < gifCount; i++) {
            def gifFile = new File(gifDir, "${i + 1}.gif")
            if (!gifFile.exists()) {
                missing << gifFile.name
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("缺失 ${missing.size()} 个 gif 文件: ${missing.join(', ')}")
        }

        // 3. 检查 zip 大小
        def zipFile = file('hiddensomething/gifs.zip')
        if (!zipFile.exists()) {
            throw new GradleException("gifs.zip 不存在")
        }

        def sizeInMb = zipFile.length() / 1024.0 / 1024.0  // 用 1024.0 避免整数除法
        println "gifs.zip 大小: ${String.format('%.2f', sizeInMb)} MB"

        if (sizeInMb > 25) {
            throw new GradleException("gifs.zip 超过 25MB，当前大小: ${String.format('%.2f', sizeInMb)} MB")
        }
    }
}

tasks.named('classes') {
    dependsOn tasks.named('processTextFiles', Copy)
}
tasks.named('classes') {
    dependsOn tasks.named('checkGifsZipSize')
}
tasks.named('checkGifsZipSize') {
    dependsOn tasks.named('zipGifs', Zip)
}